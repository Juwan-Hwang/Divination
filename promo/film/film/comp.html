const $ = (id) => document.getElementById(id);

const easeInC = (x) => x * x * x;
const SPC = {}; const sp = (vd, b) => (SPC[vd + ':' + b] ||= MO.spring(vd, b));

const pending = [];
function setSrc(img, src) { if (img.getAttribute('src') !== src) { img.setAttribute('src', src); pending.push(img.decode().catch(() => {})); } }

// ───────────────────────── the carry: the cinnabar dot, one owner per frame ─────────────────────────
let CAR = null;
function carry(x, y, d, o = 1, step = false) { CAR = { x, y, d, o, step }; }
function drawCarry() {
  const el = $('dot');
  if (!CAR || CAR.o <= 0) { show(el, false); return; }
  show(el, true);
  el.style.width = el.style.height = '100px';
  el.style.transform = `translate(${r2(CAR.x - 50)}px,${r2(CAR.y - 50)}px) scale(${(CAR.d / 100).toFixed(5)})`;

}
const FIELD = { x: 960, y: 540, d: 2 * Math.hypot(960, 540) + 40 };
function fieldZoom(u, p) {              // u 0 → full-frame disc, u 1 → the dot p; log-space size, the centre follows the size
  const d = Math.exp(lerp(Math.log(FIELD.d), Math.log(p.d), u));
  const k = (Math.log(FIELD.d) - Math.log(d)) / (Math.log(FIELD.d) - Math.log(p.d));
  return { x: lerp(FIELD.x, p.x, k), y: lerp(FIELD.y, p.y, k), d };
}
function glide(a, b, u) { return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), d: Math.exp(lerp(Math.log(a.d), Math.log(b.d), u)) }; }

// ───────────────────────── captions ─────────────────────────
const CAPS = [];
function caption(id, t0, t1, head, sub) { CAPS.push({ id, t0, t1, head, sub }); }

  const root = $('caps');

    const mkc = (cls, txt, base, size) => {
      const m = mk(root, 'mask'); m.style.top = (base - size * 1.1) + 'px'; m.style.height = (size * 1.5) + 'px';
      const d = mk(m, 'cap ' + cls, txt); d.style.top = (size * 0.1) + 'px'; return { m, d };

  }
}
function drawCaps(t) {
  let scrim = 0;
  for (const c of CAPS) {

    scrim = Math.max(scrim, seg(t, c.t0 - 0.2, c.t0 + 0.1) * (1 - seg(t, c.t1, c.t1 + 0.3)));
    [c.h, c.s].forEach((L, i) => {

      L.d.style.transform = `translateY(${Math.round((1 - a) * 70 + out * 26)}px)`; op(L.d, 1 - out);

}

// ───────────────────────── typed lines ─────────────────────────
const keyEvents = [];
function typedLine(root, text, size, wght, t0, dur, track) {
  const d = mk(root, 'ln'); d.style.fontSize = size + 'px'; d.style.fontWeight = wght; if (track != null) d.style.letterSpacing = track + 'px';
  for (const ch of [...text]) { const s = document.createElement('span'); s.textContent = ch; d.appendChild(s); }
  return { el: d, text: [...text], size, t0, dur, spans: [...d.children], right: [], x: 0, base: 0 };
}
function measureLine(L) { const r0 = L.el.getBoundingClientRect(); L.right = L.spans.map((s) => s.getBoundingClientRect().right - r0.left); L.width = L.right[L.right.length - 1]; }
function nTyped(L, t) { return Math.floor(clamp((t - L.t0) / L.dur) * L.text.length + 1e-6); }
function drawLine(L, t, dy = 0, o = 1, all = false) {
  const n = all ? L.text.length : nTyped(L, t);
  L.spans.forEach((s, i) => { s.style.opacity = i < n ? 1 : 0; });
  L.el.style.transform = `translate(${Math.round(L.x)}px,${Math.round(L.base - L.size * 0.88 + dy)}px)`;
  op(L.el, o); show(L.el, true);

}

}

// ───────────────────────── 12–20: the real cast in a terminal, then the hexagram lifts out ─────────────────────────
const WIN = { x: 250, y: 120, w: 1420, h: 800 }, TBAR = 46, PADX = 40, PADY = 22, LH = 40, FS = 26;

}
// cell geometry of the terminal in "window space" (unzoomed screen px)
const cellX = (col) => CX0 + col * ADV;

function buildTermCam() {

}
function termCaretWin(t) {

// the hexagram: six bars start exactly on the terminal's ━ glyphs and spring out to a large hexagram, then the three
